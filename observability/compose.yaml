services:
  otel-collector:
    image: otel/opentelemetry-collector:0.163.2
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"

  jaeger:
    # Grafana's Jaeger data source needs the legacy service-search HTTP API.
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    ports:
      - "127.0.0.1:16686:16686"

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./grafana:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - jaeger

  signoz:
    image: signoz/signoz:v0.147.0
    environment:
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: tcp://clickhouse:9000
      SIGNOZ_SQLSTORE_SQLITE_PATH: /var/lib/signoz/signoz.db
      SIGNOZ_TOKENIZER_JWT_SECRET: local-demo-secret
      SIGNOZ_ANALYTICS_ENABLED: "false"
      SIGNOZ_USER_ROOT_ENABLED: "${SIGNOZ_USER_ROOT_ENABLED:-true}"
      SIGNOZ_USER_ROOT_EMAIL: ${SIGNOZ_USER_ROOT_EMAIL:-admin@admin.at}
      SIGNOZ_USER_ROOT_PASSWORD: "${SIGNOZ_USER_ROOT_PASSWORD:-Admin123456!}"
      SIGNOZ_USER_ROOT_ORG_NAME: ${SIGNOZ_USER_ROOT_ORG_NAME:-default}
    volumes:
      - signoz-data:/var/lib/signoz
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      signoz-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  signoz-collector:
    image: signoz/signoz-otel-collector:v0.144.6
    command: ["--config=/etc/signoz/collector.yaml"]
    environment:
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER: cluster
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION: "true"
    volumes:
      - ./signoz/collector.yaml:/etc/signoz/collector.yaml:ro
    depends_on:
      signoz-migrate:
        condition: service_completed_successfully

  signoz-migrate:
    image: signoz/signoz-otel-collector:v0.144.6
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - /signoz-otel-collector migrate bootstrap && /signoz-otel-collector migrate sync up && /signoz-otel-collector migrate async up
    environment:
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER: cluster
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION: "true"
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    depends_on:
      clickhouse:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:25.12.5
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - ./signoz/clickhouse.xml:/etc/clickhouse-server/config.d/signoz.xml:ro
      - ./signoz/custom-function.xml:/etc/clickhouse-server/custom-function.xml:ro
      - clickhouse-scripts:/var/lib/clickhouse/user_scripts
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      zookeeper:
        condition: service_healthy
      signoz-init:
        condition: service_completed_successfully

  zookeeper:
    image: signoz/zookeeper:3.7.1
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    volumes:
      - zookeeper-data:/bitnami/zookeeper
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/commands/ruok | grep -q '\"error\" : null'"]
      interval: 5s
      timeout: 3s
      retries: 30

  # SigNoz uses this small upstream function for latency quantile queries.
  signoz-init:
    image: clickhouse/clickhouse-server:25.12.5
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        [ -x /var/lib/clickhouse/user_scripts/histogramQuantile ] && exit 0
        arch=$$(uname -m | sed 's/aarch64/arm64/;s/x86_64/amd64/')
        wget -qO /tmp/histogram.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2Fv0.0.1/histogram-quantile_linux_$${arch}.tar.gz"
        tar -xzf /tmp/histogram.tar.gz -C /tmp
        cp /tmp/histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    volumes:
      - clickhouse-scripts:/var/lib/clickhouse/user_scripts

volumes:
  grafana-data:
  signoz-data:
  clickhouse-data:
  clickhouse-scripts:
  zookeeper-data:
