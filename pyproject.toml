[project]
name = "observability101"
version = "0.1.0"
description = "A small TODO app with FastAPI, an agent, MCP, and OpenTelemetry."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlmodel>=0.0.24,<0.1",
  "pydantic-ai-slim[google,mcp]>=1.107,<2",
  "mcp>=1.30,<2",
  "python-dotenv>=1,<2",
  "opentelemetry-sdk>=1.38,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
  "opentelemetry-instrumentation-fastapi>=0.59b0,<1",
  "opentelemetry-instrumentation-asgi>=0.59b0,<1",
  "opentelemetry-instrumentation-httpx>=0.59b0,<1",
  "opentelemetry-instrumentation-sqlite3>=0.59b0,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not instrumentation"'
markers = ["instrumentation: run after completing the instrumentation exercises"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
